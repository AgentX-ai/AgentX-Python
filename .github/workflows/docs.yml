# The docs are the only description of the SDK most people read, and nothing checked them:
# 0.6.36 consolidated grading configs into an LLM Judge Scorer and shipped with no mention of
# it anywhere in EVALUATIONS.md, TRACING.md, README.md or CICD_EVAL.md. release.yml only
# publishes, so there was no job that could have noticed.
#
# Scope is deliberate. This runs the checks that hold the documentation against the package,
# plus the unit tests for the surface it documents - both green on the base install. It is
# not the whole suite: tests/test_integrations.py and tests/test_span_tree.py need optional
# extras (google-adk) and fail on ImportError without them, so running everything here would
# ship a red badge that says nothing about the docs. Widening this to the full suite wants
# the extras installed first, and is its own change.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The version release.yml builds the published wheel with, and a current one.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[langchain]" pytest
      - run: python -m pytest tests/test_docs_match_sdk.py tests/test_judge_scorers.py -q
